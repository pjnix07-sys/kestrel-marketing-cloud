name = "mc-wif-relay"
main = "worker.js"
compatibility_date = "2026-10-01"

[vars]
# Exact origins of the deployed app (scheme + host, no path). Comma separated.
ALLOWED_ORIGINS = "https://your-org.github.io"
FEDERATION_RULE_ID = "fdrl_REPLACE_ME"
ORGANIZATION_ID = "00000000-0000-0000-0000-000000000000"
# WORKSPACE_ID = "wrkspc_REPLACE_ME"
# SERVICE_ACCOUNT_ID = "svac_REPLACE_ME"

# Optional per-IP limit (Workers Rate Limiting binding):
# [[unsafe.bindings]]
# name = "RATE_LIMITER"
# type = "ratelimit"
# namespace_id = "1001"
# simple = { limit = 20, period = 60 }
